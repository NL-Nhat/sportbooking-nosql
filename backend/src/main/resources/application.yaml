server:
  port: 8081

spring:
  application:
    name: sportbooking-backend
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/sportbooking_db}
    database: ${MONGODB_DATABASE:sportbooking_db}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/sportbooking_db}
      database: ${MONGODB_DATABASE:sportbooking_db}
      auto-index-creation: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

jwt:
  secret: ${JWT_SECRET:SportBookingSuperSecretKeyForJwtSigning2026MustBeAtLeast32BytesLong!}
  access-token-expiration-seconds: 900
  refresh-token-expiration-seconds: 604800

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
